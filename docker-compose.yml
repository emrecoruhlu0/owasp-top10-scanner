version: "3.9"

services:
  scanner:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - MAX_CONCURRENT_SCANS=3
    volumes:
      - scan_reports:/tmp/scans
    depends_on:
      - ollama
    networks:
      - internal
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - internal
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/static:/usr/share/nginx/html:ro
    depends_on:
      - scanner
    networks:
      - internal
    restart: unless-stopped

volumes:
  scan_reports:
  ollama_models:

networks:
  internal:
    driver: bridge
