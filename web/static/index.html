<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Zafiyet Tarayıcısı</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <div class="container">
      <div>
        <h1>🔍 AI Destekli Web Zafiyet Tarayıcısı</h1>
        <div class="subtitle">OWASP Top 10 · 2021</div>
      </div>
      <div style="margin-left:auto">
        <a href="/static/index.html" class="btn btn-ghost btn-sm">Ana Sayfa</a>
      </div>
    </div>
  </header>

  <main>
    <div class="container">

      <!-- Tarama Formu -->
      <div class="card">
        <h2>Yeni Tarama</h2>

        <label>Hedef URL</label>
        <input type="text" id="targetUrl" placeholder="http://hedef-site.com/" />

        <label style="margin-top:14px">Test Ortamı Hızlı Seçim</label>
        <div class="quick-targets" id="quickTargets"></div>

        <label style="margin-top:14px">Modüller</label>
        <div style="display:flex;gap:8px;margin-bottom:6px">
          <button class="btn btn-ghost btn-sm" onclick="selectAllModules(true)">Tümünü Seç</button>
          <button class="btn btn-ghost btn-sm" onclick="selectAllModules(false)">Temizle</button>
        </div>
        <div class="module-grid" id="moduleGrid"></div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px">
          <div>
            <label>Cookie (opsiyonel)</label>
            <textarea id="cookieInput" placeholder="PHPSESSID=abc123; security=low" style="min-height:44px"></textarea>
          </div>
          <div>
            <label>Timeout (saniye)</label>
            <input type="number" id="timeoutInput" value="5" min="1" max="60" style="margin-bottom:6px" />
            <div class="toggle-row">
              <label class="toggle">
                <input type="checkbox" id="llmToggle" checked />
                <span class="toggle-slider"></span>
              </label>
              <span style="font-size:13px">AI Analizi (LLM)</span>
            </div>
          </div>
        </div>

        <div style="display:flex;gap:10px;margin-top:18px;align-items:center">
          <button class="btn btn-primary" id="startBtn" onclick="startScan()">
            <span>▶</span> Taramayı Başlat
          </button>
          <button class="btn btn-danger" id="cancelBtn" onclick="cancelScan()" style="display:none">
            <span>■</span> İptal Et
          </button>
          <span id="statusText" style="color:var(--color-muted);font-size:12px"></span>
        </div>
      </div>

      <!-- İlerleme -->
      <div class="card" id="progressCard" style="display:none">
        <h2>Tarama İlerlemesi</h2>
        <div class="progress-bar" id="progressBar"></div>
        <div id="activeModule" style="font-size:12px;color:var(--color-muted);margin-bottom:10px"></div>
        <div class="log-panel" id="logPanel"></div>
      </div>

      <!-- Canlı Bulgular -->
      <div class="card" id="findingsCard" style="display:none">
        <h2>Bulgular <span id="findingCount" style="color:var(--color-muted);font-weight:400;font-size:13px"></span></h2>
        <div class="finding-list" id="findingList">
          <div class="empty">Henüz bulgu yok...</div>
        </div>
      </div>

    </div>
  </main>

  <script src="/static/app.js"></script>
  <script>initPage();</script>
</body>
</html>
