# Test ortamı overlay — savunmasız uygulamalar
# Kullanım: docker compose -f docker-compose.yml -f docker-compose.test.yml up
#
# Bu dosya docker-compose.yml üzerine eklenir.
# Scanner container'ı bu servislere internal network üzerinden ulaşır:
#   DVWA       → http://dvwa/
#   Juice Shop → http://juice-shop:3000/
#   WebGoat    → http://webgoat:8080/WebGoat/

services:
  dvwa:
    image: vulnerables/web-dvwa
    environment:
      - MYSQL_PASS=dvwa
    healthcheck:
      # DVWA imajinda curl/wget yok; sadece php var. login.php'ye HTTP istegi
      # atip 200 dondurdugunu php ile dogruluyoruz.
      # Not: Compose degisken interpolasyonu icin $ -> $$ olarak escape edildi.
      test: ["CMD-SHELL", "php -r '$$h=@get_headers(\"http://localhost/login.php\"); exit(($$h && strpos($$h[0],\"200\")!==false)?0:1);'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - internal
    restart: unless-stopped

  juice-shop:
    image: bkimminich/juice-shop
    networks:
      - internal
    restart: unless-stopped

  webgoat:
    image: webgoat/webgoat
    # Imajin kendi healthcheck'i 'curl' kullaniyor ama imajda curl yok (wget var).
    # Override ediyoruz; WebGoat'in baslamasi yavas, start_period genis tutuldu.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/WebGoat/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - internal
    restart: unless-stopped
